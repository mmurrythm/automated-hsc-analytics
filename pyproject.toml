[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bangladesh-hsc-analytics"
version = "0.1.0"
description = "Reproducible analytics for Bangladesh HSC 2026 institution-level results"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2,<4",
  "requests>=2.32,<3",
  "beautifulsoup4>=4.12,<5",
  "lxml>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
hsc-analytics = "hsc_analytics.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
